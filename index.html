  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  @keyframes ecg { from { background-position-x: 0; } to { background-position-x: -240px; } }

  @keyframes sobe3d { from { opacity: 0; transform: perspective(900px) rotateX(22deg) translateY(22px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes lado3d { from { opacity: 0; transform: perspective(1000px) rotateY(-24deg) translateX(30px); } to { opacity: 1; transform: none; } }
  @keyframes folha3d { from { opacity: 0; transform: perspective(1400px) rotateX(-16deg) translateY(70px) scale(.97); } to { opacity: 1; transform: none; } }
